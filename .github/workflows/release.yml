# Fase L1: cada tag vX.Y.Z gera um release em RASCUNHO no GitHub com tudo o que o atualizador do
# app (electron-updater) precisa: o instalador, o latest.yml, o .blockmap e o SHA256SUMS.txt. As
# novidades vêm da seção da versão no CHANGELOG.md. Quem publica o rascunho é o dono, à mão.
# O único segredo é CURSEFORGE_API_KEY, usado só no passo do build (nunca impresso).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # criar o release em rascunho e subir os arquivos

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A tag precisa ser a versão do package.json (é ela que vai no latest.yml).
      - name: Conferir a versão da tag
        run: |
          versao="$(node -p "require('./package.json').version")"
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $versao do package.json."
            exit 1
          fi
          echo "VERSAO=$versao" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Gera release/HubSquare-Setup-<versão>.exe, .exe.blockmap, latest.yml e SHA256SUMS.txt.
      # A chave do CurseForge entra só aqui, pelo ambiente; sem o segredo, o app sai com o
      # CurseForge "em breve".
      - name: Build do instalador
        run: npm run dist
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      # ---------------------------------------------------------------------------------------
      # Assinatura pelo SignPath Foundation: desligada até o projeto ser aceito. Como ligar está
      # em docs/assinatura.md. Os segredos/variáveis SIGNPATH_* ficam só no GitHub.
      # ---------------------------------------------------------------------------------------
      # - name: Guardar o instalador sem assinatura
      #   id: sem-assinatura
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: instalador-sem-assinatura
      #     path: release/HubSquare-Setup-${{ env.VERSAO }}.exe
      #     if-no-files-found: error
      #
      # - name: Assinar pelo SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: hubsquare
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.sem-assinatura.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: release/assinado
      #
      # # O instalador assinado muda de hash: troca o arquivo e recalcula o latest.yml, o .blockmap
      # # e o SHA256SUMS.txt, senão o atualizador recusa o download.
      # - name: Usar o instalador assinado
      #   run: |
      #     exe="HubSquare-Setup-$VERSAO.exe"
      #     mv "release/assinado/$exe" "release/$exe"
      #     node -e "
      #       const fs = require('fs')
      #       const { buildBlockMap } = require('app-builder-lib/out/targets/blockmap/blockmap')
      #       const exe = 'release/' + process.argv[1]
      #       buildBlockMap(exe, 'gzip', exe + '.blockmap').then((info) => {
      #         const yml = fs.readFileSync('release/latest.yml', 'utf8')
      #           .replace(/sha512: .*/g, 'sha512: ' + info.sha512)
      #           .replace(/size: .*/g, 'size: ' + info.size)
      #         fs.writeFileSync('release/latest.yml', yml)
      #       })
      #     " "$exe"
      #     node scripts/checksums.mjs

      # As novidades da versão: a seção "## [X.Y.Z]" do CHANGELOG.md, até a próxima seção.
      - name: Novidades do CHANGELOG
        run: |
          node -e "
            const fs = require('fs')
            const linhas = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/)
            const i = linhas.findIndex((l) => l.startsWith('## [' + process.env.VERSAO + ']'))
            let fim = linhas.findIndex((l, n) => n > i && l.startsWith('## ['))
            if (fim < 0) fim = linhas.length
            const notas = i < 0 ? 'Veja o CHANGELOG.md.' : linhas.slice(i + 1, fim).join('\n').trim()
            fs.writeFileSync('notas.md', notas + '\n')
          "

      # Release em RASCUNHO: nada fica público nem chega ao atualizador até o dono publicar.
      - name: Criar o release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "HubSquare $VERSAO" \
            --notes-file notas.md \
            "release/HubSquare-Setup-$VERSAO.exe" \
            "release/HubSquare-Setup-$VERSAO.exe.blockmap" \
            release/latest.yml \
            release/SHA256SUMS.txt
