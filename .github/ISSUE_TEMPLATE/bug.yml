name: Bug report / Relatar um problema
description: Something doesn't work as expected. / Algo não funciona como deveria.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please don't include passwords, tokens, PINs or your CurseForge key. For security problems, see SECURITY.md instead.
        Obrigado! Não inclua senhas, tokens, PIN nem a sua chave do CurseForge. Falhas de segurança: veja o SECURITY.md.
  - type: input
    id: versao
    attributes:
      label: HubSquare version / Versão do HubSquare
      description: Gear › About. / Engrenagem › Sobre.
      placeholder: 1.3.0
    validations:
      required: true
  - type: textarea
    id: oque
    attributes:
      label: What happened? / O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Steps to reproduce / Como reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: What did you expect? / O que você esperava?
  - type: textarea
    id: relatorio
    attributes:
      label: Error report / Relatório de erro
      description: Options › General › Help › "Create error report" saves a .zip without secrets on your Desktop; you can attach it here. / Opções › Gerais › Ajuda › "Gerar relatório de erro" salva um .zip sem segredos na Área de Trabalho; dá para anexar aqui.
