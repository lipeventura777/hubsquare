# Fase E2: appId do HubSquare. O build/installer.nsh tira a instalação antiga (com.servsquare.app)
# antes de instalar, sem apagar dados.
appId: com.hubsquare.app
productName: HubSquare
# Detalhes do .exe no Windows (Propriedades › Detalhes): nome, versão (do package.json), autor e
# copyright.
copyright: Copyright © 2026 lipeventura777
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!scripts/*'
  - '!release/*'
  # Pasta de testes (servidores e modpacks de vários GB) e cache do TypeScript.
  - '!.teste/**'
  - '!*.tsbuildinfo'
  - '!docs/**'
  - '!DESIGN.md'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,PROJETO.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{README.pt-BR.md,PRIVACY.md,PRIVACY.pt-BR.md,SECURITY.md,CONTRIBUTING.md,THIRD_PARTY_NOTICES.md,CODE_SIGNING_POLICY.md}'
  - '!.github/**'
  # Arquivos soltos desta máquina (logs com caminhos do PC, sessões de navegador): nunca no app.
  - '!**/*.log'
  - '!.playwright-mcp/**'
# O ícone da bandeja fica fora do asar para o Windows conseguir ler.
asarUnpack:
  - resources/**
win:
  executableName: HubSquare
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
nsis:
  # Instalador com telas (não "um clique"), para poder escolher a pasta de instalação.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # A licença (GPL-3.0-or-later, texto oficial) aparece numa tela do instalador.
  license: LICENSE
  artifactName: HubSquare-Setup-${version}.${ext}
  shortcutName: HubSquare
  uninstallDisplayName: HubSquare
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  # Fase I1: instalador em português e inglês, com a escolha no começo; build/installer.nsh passa
  # a escolha para o app.
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - pt_BR
    - en_US
  language: '1033'
# Fase M6: abrir um convite (link hubsquare://convite/... ou arquivo .hubsquare) abre o HubSquare.
protocols:
  - name: Convite do HubSquare
    schemes:
      - hubsquare
fileAssociations:
  - ext: hubsquare
    name: Convite do HubSquare
    description: Convite do HubSquare
    # Logo nova: o .ico tem a versão pequena até 48 px e a completa de 64 px para cima.
    icon: build/icon.ico
npmRebuild: false
# Fase L1: atualização automática pelos releases do GitHub do repositório (o mesmo do
# package.json). Gera o latest.yml e o .blockmap no release/ e o app-update.yml dentro do app.
# O npm run dist nunca publica (--publish never): quem sobe os arquivos é o release.yml, num
# release em rascunho.
publish:
  provider: github
  owner: lipeventura777
  repo: hubsquare
  releaseType: draft
